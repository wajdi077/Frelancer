databaseChangeLog:
  - changeSet:
      id: 1
      author: liquibase
      changes:
        - createTable:
            tableName: employe
            columns:
              - column:
                  name: employeID
                  type: varchar(255)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: nom
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: prenom
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: age
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: varchar(255)
                  constraints:
                    nullable: false

  - changeSet:
      id: 2
      author: liquibase
      changes:
        - createTable:
            tableName: task
            columns:
              - column:
                  name: taskID
                  type: varchar(255)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: task_name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: employeID
                  type: varchar(255)
                  constraints:
                    nullable: true

  - changeSet:
      id: 3
      author: liquibase
      changes:
        - addForeignKeyConstraint:
            baseTableName: task
            baseColumnNames: employeID
            constraintName: fk_task_employe
            referencedTableName: employe
            referencedColumnNames: employeID
            onDelete: CASCADE
